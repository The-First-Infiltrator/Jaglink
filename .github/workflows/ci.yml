name: JAGLINK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-audit:
    name: Standalone / Jaguar identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify standalone Jaguar source tree
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t gitlinks < <(git ls-files --stage | awk '$1 == "160000" { print $4 }')
          if [[ "${#gitlinks[@]}" -ne 1 || "${gitlinks[0]}" != "src/infiltratr-common" ]]; then
            printf 'Unexpected gitlink dependency set:\n%s\n' "${gitlinks[*]:-<none>}" >&2
            exit 1
          fi

          if git ls-files | grep -Eiq '(^|/)(upstream|mblink)(/|$)|mblink|mb-link'; then
            echo 'A tracked path still carries an upstream or MBLINK identity.' >&2
            exit 1
          fi

          if git grep -n -I -i -E 'mblink|mb-link|mercedes|mercedes-benz' -- . ':(exclude).github/workflows/ci.yml' ':(exclude)README.md' ':(exclude)docs/ORIGIN.md'; then
            echo 'A non-provenance file still carries an MBLINK or Mercedes identity.' >&2
            exit 1
          fi

          git grep -q 'JAGLINK_VERSION' -- CMakeLists.txt include/jaglink src/core
          git grep -q 'JagLinkBLETransport' -- platform/apple app/ios

  portable-core:
    name: ${{ matrix.os }} / C11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-discover:
    name: Windows / OpenPort J2534 GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Win32 build
        run: >-
          cmake -S . -B build -A Win32
          -DJAGLINK_BUILD_WINDOWS_DISCOVER=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test portable safety and evidence paths
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload jaglink-discover
        uses: actions/upload-artifact@v4
        with:
          name: jaglink-discover-windows-x86
          path: build/Release/jaglink-discover.exe
          if-no-files-found: error

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DJAGLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure

  linux-shell:
    name: Linux / GTK4 app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --target jaglink-linux --parallel

  ios-simulator:
    name: iOS / simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project app/ios/JAGLINK.xcodeproj \
            -scheme JAGLINK \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  iphone-device-ipa:
    name: iPhone / unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/jaglink-device-derived"
          xcodebuild \
            -project app/ios/JAGLINK.xcodeproj \
            -scheme JAGLINK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
          app="$derived/Build/Products/Release-iphoneos/JAGLINK.app"
          test -d "$app"
          test -x "$app/JAGLINK"
          /usr/bin/lipo -info "$app/JAGLINK" | grep -q arm64

      - name: Package unsigned IPA
        shell: bash
        env:
          JAGLINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/jaglink-device-derived"
          package="$RUNNER_TEMP/jaglink-ipa"
          ipa="$RUNNER_TEMP/JAGLINK-${JAGLINK_VERSION}-unsigned.ipa"
          rm -rf "$package"
          mkdir -p "$package/Payload"
          /usr/bin/ditto \
            "$derived/Build/Products/Release-iphoneos/JAGLINK.app" \
            "$package/Payload/JAGLINK.app"
          (
            cd "$package"
            /usr/bin/zip -qry "$ipa" Payload
          )
          test -s "$ipa"
          /usr/bin/unzip -tq "$ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/JAGLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [standalone-audit, portable-core, windows-discover, sanitizers, linux-shell, ios-simulator, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: JAGLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets

      - name: Create or update release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;
            const assetName = `JAGLINK-${version}-unsigned.ipa`;
            const assetPath = path.join(process.env.GITHUB_WORKSPACE, 'release-assets', assetName);

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== target) {
              core.info(`Skipping stale run at ${target}; main is ${main.data.commit.sha}.`);
              return;
            }

            let tagRef;
            try {
              tagRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (tagRef.data.object.sha !== target) {
                core.setFailed(`${tag} already points to ${tagRef.data.object.sha}, not ${target}.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: `JAGLINK ${version}`,
                body: `JAGLINK ${version} — Jaguar X-Type X400 diagnostics foundation. Includes the unsigned iPhone IPA release asset.`,
                draft: false,
                prerelease: false,
                generate_release_notes: true
              })).data;
            }

            for (const asset of release.assets) {
              if (asset.name === assetName) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

            const data = fs.readFileSync(assetPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data
            });

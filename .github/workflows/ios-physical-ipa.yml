name: Build unsigned physical-device IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-physical-device-ipa:
    name: JAGLINK unsigned arm64 IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and verify unsigned IPA
        shell: bash
        run: scripts/build-ios-ipa.sh dist
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-unsigned-physical-device
          path: |
            dist/JAGLINK-unsigned.ipa
            dist/JAGLINK-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
